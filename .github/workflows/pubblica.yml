# ------------------------------------------------------------------
#  PUBBLICAZIONE AUTOMATICA DI AEGIS SU GITHUB PAGES
# ------------------------------------------------------------------
#  Cosa fa: a ogni modifica del codice, GitHub compila l'app e ne
#  scrive il risultato in un ramo separato chiamato "gh-pages".
#  GitHub Pages pubblica il contenuto di quel ramo.
#
#  PERCHE' COSI' E NON ALTRIMENTI
#  Esiste anche un modo piu' moderno (l'azione "deploy-pages"), ma
#  richiede che Pages sia stato acceso a mano nelle impostazioni,
#  altrimenti risponde "404 - Ensure GitHub Pages has been enabled".
#  Questo metodo invece si limita a scrivere in un ramo: e' il modo
#  storico, e nella maggior parte dei casi GitHub lo pubblica da solo.
#
#  Il ramo "gh-pages" contiene SOLO l'app compilata, non il codice
#  sorgente. Viene riscritto da capo a ogni pubblicazione: non c'e'
#  nulla da conservare li' dentro, e non va modificato a mano.
# ------------------------------------------------------------------

name: Pubblica Aegis

on:
  push:
    branches:
      - claude/aegis-routine-salutare-yrs0yc
      - main
  # Si puo' lanciare anche a mano, dalla scheda "Actions"
  workflow_dispatch:

# Serve il permesso di scrittura, perche' creiamo un ramo
permissions:
  contents: write

# Se parte una pubblicazione mentre la precedente e' in corso, quella
# vecchia viene annullata: online va sempre la versione piu' recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          # Stessa versione usata per provare l'app durante lo sviluppo
          node-version: '22'
          cache: 'npm'

      - name: Installa le librerie
        # "npm ci" installa le versioni esatte indicate in package-lock.json:
        # cosi' la versione online e' identica a quella provata in locale.
        run: npm ci

      - name: Compila
        run: npm run build

      - name: Scrivi il risultato nel ramo gh-pages
        run: |
          cd dist

          # Questo file vuoto dice a GitHub: "pubblica i file cosi' come
          # sono". Senza, GitHub prova a interpretarli con Jekyll (un
          # generatore di blog) e ignora le cartelle che iniziano con "_".
          touch .nojekyll

          # Costruiamo un ramo nuovo di zecca contenente solo l'app compilata
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pubblicazione automatica da ${GITHUB_SHA}"

          # --force perche' ogni pubblicazione sostituisce interamente la
          # precedente: nel ramo gh-pages non c'e' storia da conservare.
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Indirizzo dell'app
        run: |
          echo "Se la pubblicazione e' attiva, l'app e' qui:"
          echo "https://francyfibra-ai.github.io/Aegis-v.-0.1/"
