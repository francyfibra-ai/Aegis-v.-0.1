# ------------------------------------------------------------------
#  PUBBLICAZIONE AUTOMATICA DI AEGIS SU GITHUB PAGES
# ------------------------------------------------------------------
#  Cosa fa: a ogni modifica del codice, GitHub compila l'app e la
#  mette online da solo. Non serve fare nulla a mano.
#
#  IMPOSTAZIONE RICHIESTA (gia' fatta, una volta sola):
#  Settings > Pages > Source = "GitHub Actions"
#
#  Se un domani quella voce venisse rimessa su "Deploy from a branch",
#  questo file smetterebbe di pubblicare: e' il metodo ufficiale
#  abbinato a "GitHub Actions", e i due non sono intercambiabili.
# ------------------------------------------------------------------

name: Pubblica Aegis

on:
  push:
    branches:
      - claude/aegis-routine-salutare-yrs0yc
      - main
  # Si puo' lanciare anche a mano, dalla scheda "Actions"
  workflow_dispatch:

# I permessi minimi necessari per pubblicare
permissions:
  contents: read
  pages: write
  id-token: write

# Se parte una pubblicazione mentre la precedente e' in corso, quella
# vecchia viene annullata: online va sempre la versione piu' recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # --- 1. Compila l'app -------------------------------------------
  compila:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          # Stessa versione usata per provare l'app durante lo sviluppo:
          # cosi' la versione online e' compilata come quella verificata.
          node-version: '22'
          cache: 'npm'

      - name: Installa le librerie
        # "npm ci" installa le versioni esatte indicate in package-lock.json:
        # cosi' la versione online e' identica a quella provata in locale.
        run: npm ci

      - name: Compila
        run: npm run build

      - name: Prepara i file per la pubblicazione
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # --- 2. Mette online il risultato -------------------------------
  pubblica:
    needs: compila
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.messa-online.outputs.page_url }}
    steps:
      - name: Metti online
        id: messa-online
        uses: actions/deploy-pages@v4
