# ------------------------------------------------------------------
#  CAMBIA LE CHIAVI DELLE NOTIFICHE
# ------------------------------------------------------------------
#  Si lancia A MANO, dalla scheda "Actions": genera una nuova coppia
#  di chiavi per le notifiche e la mette dove serve, senza che la
#  chiave privata passi mai sotto gli occhi di qualcuno.
#
#   1. genera le chiavi (supabase/nuove-chiavi-vapid.mjs)
#   2. salva pubblica e privata nei Secrets di Supabase
#   3. scrive la pubblica nell'app (src/lib/configurazione.js)
#   4. ripubblica l'app
#
#  Dopo, alla prima apertura, il telefono si reiscrive da solo con la
#  chiave nuova (riallineaIscrizione in src/lib/push.js). Fino a quel
#  momento i promemoria verso quel telefono non arrivano: conviene
#  aprire l'app subito dopo.
#
#  Usa lo stesso segreto SUPABASE_ACCESS_TOKEN della sveglia.
# ------------------------------------------------------------------

name: Cambia le chiavi delle notifiche

on:
  workflow_dispatch:

permissions:
  contents: write   # per salvare la nuova chiave pubblica nel progetto
  actions: write    # per far ripartire la pubblicazione dell'app

jobs:
  cambia:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepara la riga di comando di Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Genera le chiavi nuove
        run: node supabase/nuove-chiavi-vapid.mjs "$RUNNER_TEMP/vapid.env"

      - name: Salvale nei Secrets di Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Manca il segreto SUPABASE_ACCESS_TOKEN nelle impostazioni della repository."
            exit 1
          fi
          # --yes: senza, Supabase chiede conferma e da qui nessuno puo' rispondere.
          supabase secrets set --env-file "$RUNNER_TEMP/vapid.env" --project-ref zikfldmqdsacywvxiuab --yes
          # Il file con la chiave privata non serve piu': via subito.
          shred -u "$RUNNER_TEMP/vapid.env"

      - name: Salva la chiave pubblica nell'app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/configurazione.js
          git commit -m "Nuova chiave pubblica delle notifiche"
          git push

      - name: Ripubblica l'app
        # Un salvataggio fatto da GitHub stesso non fa partire da solo
        # la pubblicazione: la lanciamo esplicitamente.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pubblica.yml --ref "${{ github.ref_name }}"
