# ------------------------------------------------------------------
#  PUBBLICA LA SVEGLIA SU SUPABASE
# ------------------------------------------------------------------
#  Sostituisce il copia-incolla nell'editor del pannello Supabase, che
#  richiede di azzeccare il nome del file, di cancellare tutto il
#  codice di esempio e di incollarne 750 righe da telefono.
#
#  Qui la funzione viene presa dai file del progetto e pubblicata dalla
#  riga di comando ufficiale di Supabase, che sa gia' unire i tre file.
#
#  SERVE UNA VOLTA SOLA: un segreto chiamato SUPABASE_ACCESS_TOKEN
#  nelle impostazioni della repository (vedi docs/04-notifiche.md).
# ------------------------------------------------------------------

name: Pubblica la sveglia

on:
  # A mano, dalla scheda "Actions"
  workflow_dispatch:
  # E automaticamente, quando cambia il codice della funzione
  push:
    branches:
      - claude/aegis-routine-salutare-yrs0yc
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/pubblica-funzione.yml'

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara la riga di comando di Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Pubblica la funzione "promemoria"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Manca il segreto SUPABASE_ACCESS_TOKEN nelle impostazioni della repository."
            echo "Vedi docs/04-notifiche.md, sezione 'Pubblicare la sveglia da GitHub'."
            exit 1
          fi
          supabase functions deploy promemoria --project-ref zikfldmqdsacywvxiuab

      - name: Indirizzo della funzione
        run: |
          echo "Pubblicata come:"
          echo "https://zikfldmqdsacywvxiuab.supabase.co/functions/v1/promemoria"
          echo ""
          echo "Ricorda: il cron deve chiamare QUESTO indirizzo."
